name: OIDC sub probe

on:
  push:
    branches:
      - "**"

# id-token: write 외의 모든 권한은 none이 된다.
permissions:
  id-token: write

env:
  # AWS 역할 신뢰 정책에서 일반적으로 검사하는 값. AWS를 호출하지는 않는다.
  OIDC_AUDIENCE: sts.amazonaws.com

jobs:
  probe-no-environment:
    name: Probe (no environment)
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims
        # 토큰을 변수나 파일에 저장하지 않고, 페이로드의 세 클레임만 출력한다.
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" |
            python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for name in ("sub", "aud", "iss"):
              print(f"{name}={claims[name]}")
          '

  probe-environment:
    name: Probe (environment probe)
    runs-on: ubuntu-latest
    environment: probe
    steps:
      - name: Print OIDC claims
        # 토큰을 변수나 파일에 저장하지 않고, 페이로드의 세 클레임만 출력한다.
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" |
            python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for name in ("sub", "aud", "iss"):
              print(f"{name}={claims[name]}")
          '
