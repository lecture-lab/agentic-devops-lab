name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/apply.yml"

# 워크플로 기본 권한은 모두 none. 각 작업에서 필요한 것만 연다.
permissions: {}

# main의 apply는 한 번에 하나만. 실행 중인 apply를 끊으면 State 잠금 파일이
# 남거나 리소스가 반쯤 만들어질 수 있으므로 진행 중인 실행은 취소하지 않는다.
# 워크플로 단위로 묶었으므로 다음 실행의 plan은 앞 실행의 apply가 끝난 뒤에 계산된다.
concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.17.0
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  # bootstrap의 state_key와 같아야 한다 (역할 권한이 이 키로만 열려 있다).
  STATE_KEY: dev/terraform.tfstate
  # 커밋 해시 폴더. 두 역할 모두 plans/* 에만 Get/Put 권한이 있다.
  PLAN_PREFIX: plans/${{ github.sha }}
  BUNDLE_NAME: build.tar.gz

jobs:
  plan:
    name: plan (read-only role)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # environment를 지정하지 않는다. 지정하면 OIDC sub가
    # repo:<저장소>:environment:<이름>으로 바뀌어 plan 역할 신뢰 정책
    # (repo:<저장소>:ref:refs/heads/main)과 맞지 않는다.
    permissions:
      contents: read # 코드 체크아웃
      id-token: write # AWS OIDC 토큰 발급
    defaults:
      run:
        shell: bash
        working-directory: infra/environments/dev
    outputs:
      tfplan_sha256: ${{ steps.upload.outputs.tfplan_sha256 }}
      bundle_sha256: ${{ steps.upload.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.PLAN_ROLE_NAME }}
          role-session-name: apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        # -lockfile=readonly: 커밋된 .terraform.lock.hcl과 다르면 실패한다.
        run: |
          terraform init -no-color -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Bundle .build and upload plan
        id: upload
        # tfplan과 Lambda zip 묶음(.build)을 plans/<커밋 해시>/ 아래에 올린다.
        # sha256은 작업 출력으로 남겨 apply 작업이 S3에서 받은 파일과 대조한다
        # (plans/*는 PR plan 작업도 쓸 수 있으므로 S3 내용만 믿지 않는다).
        run: |
          set -euo pipefail
          test -f tfplan
          if [ ! -d .build ]; then
            echo "::error::.build 폴더가 없습니다. plan이 Lambda zip을 만들지 않았습니다."
            exit 1
          fi
          tar -czf "${BUNDLE_NAME}" .build
          tfplan_sha256=$(sha256sum tfplan | cut -d' ' -f1)
          bundle_sha256=$(sha256sum "${BUNDLE_NAME}" | cut -d' ' -f1)

          aws s3 cp --no-progress tfplan "s3://${STATE_BUCKET}/${PLAN_PREFIX}/tfplan"
          aws s3 cp --no-progress "${BUNDLE_NAME}" "s3://${STATE_BUCKET}/${PLAN_PREFIX}/${BUNDLE_NAME}"

          {
            echo "tfplan_sha256=${tfplan_sha256}"
            echo "bundle_sha256=${bundle_sha256}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan (main @ \`${GITHUB_SHA::12}\`)"
            echo ""
            echo "- tfplan sha256: \`${tfplan_sha256}\`"
            echo "- ${BUNDLE_NAME} sha256: \`${bundle_sha256}\`"
            echo ""
            echo '```'
            terraform show -no-color tfplan | grep -E '^Plan:|^No changes\.' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (environment apply)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 이 environment의 보호 규칙(필수 검토자)이 승인 게이트다.
    # OIDC sub가 repo:<저장소>:environment:apply가 되어 apply 역할 신뢰 정책과 맞는다.
    environment: apply
    permissions:
      contents: read # 코드 체크아웃
      id-token: write # AWS OIDC 토큰 발급
    defaults:
      run:
        shell: bash
        working-directory: infra/environments/dev
    env:
      TFPLAN_SHA256: ${{ needs.plan.outputs.tfplan_sha256 }}
      BUNDLE_SHA256: ${{ needs.plan.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        # 기본값으로 plan 작업과 같은 커밋(github.sha)을 받는다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check expected hashes
        run: |
          set -euo pipefail
          for v in TFPLAN_SHA256 BUNDLE_SHA256; do
            if ! [[ "${!v}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::plan 작업 출력 ${v} 값이 올바른 sha256이 아닙니다."
              exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.APPLY_ROLE_NAME }}
          role-session-name: apply-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Setup Terraform
        # 저장된 plan은 만든 것과 같은 Terraform 버전에서만 적용할 수 있다.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -no-color -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Download and verify tfplan
        run: |
          set -euo pipefail
          rm -f tfplan
          aws s3 cp --no-progress "s3://${STATE_BUCKET}/${PLAN_PREFIX}/tfplan" tfplan
          echo "${TFPLAN_SHA256}  tfplan" | sha256sum -c -

      - name: Download, verify and extract .build bundle
        run: |
          set -euo pipefail
          if [ -e .build ]; then
            echo "::error::.build가 이미 있습니다. plan 작업이 만든 묶음만 사용해야 합니다."
            exit 1
          fi
          aws s3 cp --no-progress "s3://${STATE_BUCKET}/${PLAN_PREFIX}/${BUNDLE_NAME}" "${BUNDLE_NAME}"
          echo "${BUNDLE_SHA256}  ${BUNDLE_NAME}" | sha256sum -c -
          tar -xzf "${BUNDLE_NAME}" --no-same-owner
          ls -l .build

      - name: terraform apply (saved plan)
        # 저장된 plan 파일만 적용한다. plan을 다시 계산하지 않으며 -auto-approve를 쓰지 않는다.
        # (승인은 environment apply의 보호 규칙에서 받는다.)
        # 다른 실행이 그 사이 State를 바꿨다면 Terraform이 "stale plan"으로 거부한다.
        run: terraform apply -no-color -input=false -lock-timeout=5m tfplan
