name: Terraform plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
      - ".github/workflows/**"

# 워크플로 기본 권한은 모두 none. 각 작업에서 필요한 것만 연다.
permissions: {}

# 같은 PR의 실행은 하나씩만. 실행 중인 plan을 끊으면 State 잠금 파일이
# 남을 수 있으므로 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: terraform-plan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    name: fmt / init / validate / plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # environment를 지정하지 않는다. 지정하면 OIDC sub가
    # repo:<저장소>:environment:<이름>으로 바뀌어 plan 역할 신뢰 정책
    # (repo:<저장소>:pull_request)과 맞지 않는다.
    permissions:
      contents: read # 코드 체크아웃
      id-token: write # AWS OIDC 토큰 발급
    defaults:
      run:
        shell: bash
        working-directory: infra/environments/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      # bootstrap의 state_key와 같아야 한다 (plan 역할 권한이 이 키로만 열려 있다).
      STATE_KEY: dev/terraform.tfstate
    outputs:
      summary: ${{ steps.summary.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.PLAN_ROLE_NAME }}
          role-session-name: plan-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -diff -no-color

      - name: terraform init
        # -lockfile=readonly: 커밋된 .terraform.lock.hcl과 다르면 실패한다.
        run: |
          terraform init -no-color -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Summarize plan
        id: summary
        # 개수와 리소스 주소만 남긴다. 주소에 ARN이나 12자리 숫자가 섞여 있으면 가린다.
        run: |
          set -euo pipefail
          terraform show -json tfplan | jq -r '
            def clean: gsub("arn:[^\\s\"\\]]*"; "[hidden]") | gsub("[0-9]{12}"; "[hidden]") | gsub("`"; "'\''");
            [ .resource_changes[]?
              | .change.actions as $a
              | { address: (.address | clean),
                  kind: ( if   $a == ["create"] then "add"
                          elif $a == ["update"] then "change"
                          elif $a == ["delete"] then "remove"
                          elif ($a | index("create")) and ($a | index("delete")) then "replace"
                          else empty end ) } ] as $rc
            | def list($k): [ $rc[] | select(.kind == $k) | .address ];
            def section($title; $k): if (list($k) | length) > 0
                then "\n**\($title)**\n" + (list($k) | map("- `\(.)`") | join("\n"))
                else "" end;
            "<!-- terraform-plan-summary -->",
            "### Terraform plan",
            "",
            "추가 \((list("add") + list("replace")) | length) · 변경 \(list("change") | length) · 삭제 \((list("remove") + list("replace")) | length)",
            section("추가"; "add"),
            section("변경"; "change"),
            section("삭제"; "remove"),
            section("교체 (삭제 후 추가)"; "replace")
          ' > summary.md
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat summary.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  comment:
    name: PR comment
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AWS 자격 증명 없이 PR 댓글만 쓴다.
    permissions:
      pull-requests: write
    steps:
      - name: Post or update plan summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- terraform-plan-summary -->"
          if [ -n "${SUMMARY}" ]; then
            printf '%s\n' "${SUMMARY}" > body.md
          else
            # plan이 실패하면 이전 요약이 남지 않도록 실패 표시로 덮어쓴다.
            printf '%s\n### Terraform plan\n\nplan 실패. [실행 로그](%s)를 확인하세요.\n' \
              "${marker}" "${RUN_URL}" > body.md
          fi
          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | tail -n 1)
          if [ -n "${comment_id}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
          fi
